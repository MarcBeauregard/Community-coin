<meta name="description" content="The memecoin launchpad where copies feed the original: fair opening auction, vesting, spike share and Unions.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Layout: a trading floor inside a mint. The coins are the only lit objects: each meme is struck in its family's
   metal, the market opens on one coin under a spotlight (the live opening inside its countdown ring, or the top
   family), and a tape of the latest trades runs under the toolbar. Everything around them stays quiet: dark vault,
   cards one step lighter, gold for what you can press, green and red only for prices moving, orange only for
   what is live. Display face for names and coin legends, a plain sans for numbers, mono for tickers on the tape.
   Dark is the house theme; light keeps the same structure on cool paper. */
:root {
  --bg: #07090f;
  --glow-a: rgb(240 180 70 / 0.10);
  --glow-b: rgb(86 104 255 / 0.09);
  --card: #0f121b;
  --raised: #171b27;
  --well: #0a0d15;
  --soft: #1a1e2b;
  --ink: #f1f2f7;
  --ink-2: #b6bccf;
  --muted: #7b8299;
  --line: rgb(255 255 255 / 0.07);
  --line-strong: rgb(255 255 255 / 0.14);
  --gold: #f3c053;
  --gold-a: #f8d987;
  --gold-b: #e7a630;
  --gold-ink: #f6cd72;
  --on-gold: #1d1404;
  --up: #34d399;
  --on-up: #03150d;
  --down: #fb7185;
  --on-down: #2a050c;
  --hot: #ff8f3f;
  --hot-ink: #ffae73;
  --tip: #1b2031;
  --on-tip: #ffffff;
  --live: #34d399;
  --metal-0: #e3b341;
  --metal-1: #5b84f0;
  --metal-2: #2fbf98;
  --metal-3: #e25d72;
  --metal-4: #9d72ec;
  --metal-5: #aab3c6;
  --shadow-card: inset 0 1px 0 rgb(255 255 255 / 0.035), 0 20px 40px -28px rgb(0 0 0 / 0.9);
  --shadow-pop: 0 18px 40px -12px rgb(0 0 0 / 0.7), 0 0 0 1px rgb(255 255 255 / 0.08);
  --shadow-coin: rgb(0 0 0 / 0.45);
  --display: "Unbounded", "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0f6; --glow-a: rgb(240 180 70 / 0.24); --glow-b: rgb(86 104 255 / 0.10);
    --card: #ffffff; --raised: #f5f6fa; --well: #f1f3f8; --soft: #e9ecf3;
    --ink: #10131d; --ink-2: #3a4054; --muted: #646a80; --line: rgb(16 19 40 / 0.08); --line-strong: rgb(16 19 40 / 0.15);
    --gold: #c98a12; --gold-a: #f6cf6e; --gold-b: #e3a12c; --gold-ink: #8f5d00; --on-gold: #1d1404;
    --up: #0b8a5c; --on-up: #ffffff; --down: #d33a50; --on-down: #ffffff; --hot: #dc6515; --hot-ink: #a94a0c;
    --tip: #161a28; --on-tip: #ffffff; --live: #0b8a5c;
    --shadow-card: 0 1px 2px rgb(16 19 40 / 0.05), 0 14px 34px -24px rgb(16 19 40 / 0.28);
    --shadow-pop: 0 18px 40px -12px rgb(16 19 40 / 0.28), 0 0 0 1px rgb(16 19 40 / 0.08);
    --shadow-coin: rgb(16 19 40 / 0.28);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0f6; --glow-a: rgb(240 180 70 / 0.24); --glow-b: rgb(86 104 255 / 0.10);
  --card: #ffffff; --raised: #f5f6fa; --well: #f1f3f8; --soft: #e9ecf3;
  --ink: #10131d; --ink-2: #3a4054; --muted: #646a80; --line: rgb(16 19 40 / 0.08); --line-strong: rgb(16 19 40 / 0.15);
  --gold: #c98a12; --gold-a: #f6cf6e; --gold-b: #e3a12c; --gold-ink: #8f5d00; --on-gold: #1d1404;
  --up: #0b8a5c; --on-up: #ffffff; --down: #d33a50; --on-down: #ffffff; --hot: #dc6515; --hot-ink: #a94a0c;
  --tip: #161a28; --on-tip: #ffffff; --live: #0b8a5c;
  --shadow-card: 0 1px 2px rgb(16 19 40 / 0.05), 0 14px 34px -24px rgb(16 19 40 / 0.28);
  --shadow-pop: 0 18px 40px -12px rgb(16 19 40 / 0.28), 0 0 0 1px rgb(16 19 40 / 0.08);
  --shadow-coin: rgb(16 19 40 / 0.28);
  color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(1100px 520px at 50% -180px, var(--glow-a), transparent 72%),
    radial-gradient(800px 420px at 105% 8%, var(--glow-b), transparent 70%);
  background-attachment: fixed;
  color: var(--ink); font: 14px/1.45 var(--sans);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
h1 { font: 600 26px/1.15 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.tnum, .num { font-variant-numeric: tabular-nums; }
.num { text-align: right; }
.muted { color: var(--muted); }
.fine { font-size: 12.5px; }
.icon { flex: none; display: block; }
.defs { position: absolute; width: 0; height: 0; overflow: hidden; }

/* Frame */
.top-inner, main, .foot, .page-note {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 112.5rem) { .top-inner, main, .foot, .page-note { max-width: 1640px; } }
main { padding-block: 22px 36px; }
.page { display: grid; gap: 16px; }
.narrow-page { max-width: 1080px; }
.page-head { display: flex; align-items: center; gap: 14px; min-height: 36px; flex-wrap: wrap; }
.tagline { font: 500 11px/1 var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-ink); padding: 6px 10px;
  border-radius: 999px; background: color-mix(in srgb, var(--gold) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 22%, transparent); }

/* Toolbar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: saturate(1.5) blur(14px); -webkit-backdrop-filter: saturate(1.5) blur(14px); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; gap: 16px; min-height: 62px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 600 15px var(--display); text-decoration: none; letter-spacing: -0.01em; white-space: nowrap; }
.brand .coin { width: 30px; height: 30px; }
.tabs { display: flex; gap: 2px; padding: 4px; background: var(--soft); border-radius: 13px; box-shadow: inset 0 0 0 1px var(--line); }
.tabs a { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong), 0 4px 12px -6px var(--shadow-coin); }
.tabs a[aria-current="page"] .icon { color: var(--gold-ink); }
.pills { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--line); background: var(--raised);
  border-radius: 999px; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; }
.pill:hover { border-color: var(--line-strong); }
.pill-static { cursor: default; }
.pill-static:hover { border-color: var(--line); }
.theme-toggle { width: 34px; padding: 0; justify-content: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot-live { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 18%, transparent); }
.dot-demo { background: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }
.dot-hot { background: var(--hot); animation: live 1.6s ease-out infinite; }
@keyframes live { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--hot) 65%, transparent); } to { box-shadow: 0 0 0 7px color-mix(in srgb, var(--hot) 0%, transparent); } }
.account-name { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; }
.menu-button { display: none; }
.popover { position: relative; }
.menu { position: absolute; top: calc(100% + 8px); min-width: 210px; padding: 6px; background: var(--raised); border-radius: 14px; box-shadow: var(--shadow-pop); z-index: 20; display: grid; }
.menu-end { right: 0; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 9px; text-align: left; cursor: pointer; }
.menu button:hover:not(:disabled) { background: var(--soft); }
.menu button:disabled { color: var(--muted); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu-title { padding: 6px 10px 4px; font-size: 12px; color: var(--muted); }
.menu-check { margin-left: auto; color: var(--gold-ink); }
.phone-menu { position: fixed; inset: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); background: color-mix(in srgb, var(--bg) 55%, transparent); z-index: 5; }
.menu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-pop); }
.menu-grid a { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 14px; text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 13px; }
.menu-grid a[aria-current="page"] { background: color-mix(in srgb, var(--gold) 9%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 28%, transparent); color: var(--ink); }
.menu-grid a[aria-current="page"] .icon { color: var(--gold-ink); }

/* The tape */
.ticker { overflow: hidden; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--card) 55%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent); }
.ticker-track { display: flex; width: max-content; animation: tape 70s linear infinite; }
.ticker:hover .ticker-track, .ticker:focus-within .ticker-track { animation-play-state: paused; }
.ticker-group { display: flex; gap: 30px; padding: 8px 15px; }
.tick { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; text-decoration: none; white-space: nowrap; color: var(--ink-2); }
.tick b { color: var(--ink); font: 600 12px var(--mono); letter-spacing: 0.02em; }
.tick:hover b { color: var(--gold-ink); }
.tick-kind { font: 600 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
.tick-kind.up { color: var(--up); }
.tick-kind.down { color: var(--down); }
.tick-kind.accent { color: var(--gold-ink); }
@keyframes tape { to { transform: translateX(-50%); } }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow-card); min-width: 0; }
.panel { padding: 20px; display: grid; gap: 14px; align-content: start; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.panel-value { margin-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel-actions { display: flex; gap: 6px; }
.grid-12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; }
.stack-col { display: grid; gap: 16px; }

/* Hero: the spotlight coin beside the four headline numbers */
.hero { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; }
.hero.no-spot { grid-template-columns: minmax(0, 1fr); }
.spotlight { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 30px; align-items: center; padding: 26px 30px;
  background: radial-gradient(380px 300px at 16% 50%, color-mix(in srgb, var(--gold) 13%, transparent), transparent 72%), var(--card);
  border-color: color-mix(in srgb, var(--gold) 20%, var(--line)); }
.spot-stage { display: grid; place-items: center; min-width: 184px; }
.spot-halo { position: relative; display: grid; place-items: center; }
.spot-halo::before { content: ""; position: absolute; inset: -16%; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--gold) 26%, transparent), transparent); }
.spot-stage .coin-xl, .preview .coin-xl { animation: float 7s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
.spot-body { display: grid; gap: 8px; min-width: 0; justify-items: start; }
.spot-eyebrow { margin-bottom: 2px; }
.spot-sym { max-width: 100%; font: 700 clamp(28px, 3.6vw, 46px)/1.05 var(--display); letter-spacing: -0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spot-sym a { text-decoration: none; }
.spot-sym a:hover { color: var(--gold-ink); }
.spot-name { color: var(--ink-2); font-size: 15px; }
.spot-name a { color: var(--ink); }
.spot-stats { display: flex; flex-wrap: wrap; gap: 10px 30px; margin: 8px 0 4px; }
.spot-stats div { display: grid; gap: 2px; align-content: start; }
.spot-stats dt { font-size: 12px; color: var(--muted); }
.spot-stats dd { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.spot-actions { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.spot-spark { display: block; opacity: 0.9; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hero.no-spot .kpis-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-12 > *, .kpis > *, .hero > * { min-width: 0; }

/* Progress ring */
.ring { position: relative; width: var(--size); height: var(--size); display: grid; place-items: center; flex: none; }
.ring > svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring-track { fill: none; stroke: var(--line-strong); }
.ring-arc { fill: none; stroke: var(--hot); stroke-linecap: round; filter: drop-shadow(0 0 5px color-mix(in srgb, var(--hot) 70%, transparent)); transition: stroke-dasharray 1s linear; }
.ring-inner { position: relative; display: grid; place-items: center; }

/* KPI cards: label and icon square, big number, delta with a one-word baseline */
.kpi { padding: 16px 18px; display: grid; gap: 6px; align-content: start; }
.kpi-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-2); font-size: 13.5px; }
.icon-square { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; background: color-mix(in srgb, var(--gold) 9%, var(--soft)); color: var(--gold-ink); }
.kpi-value { font-size: 30px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.12; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-value small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 5px; }
.kpi.tone-hot { background: linear-gradient(180deg, color-mix(in srgb, var(--hot) 11%, var(--card)), var(--card) 70%); border-color: color-mix(in srgb, var(--hot) 38%, transparent); }
.kpi.tone-hot .kpi-value { color: var(--hot-ink); }
.kpi.tone-hot .icon-square { background: color-mix(in srgb, var(--hot) 14%, var(--soft)); color: var(--hot-ink); }
.kpi-foot { min-height: 18px; }
.delta { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta b { font-weight: 600; }
.delta .up, .up-text { color: var(--up); }
.delta .down, .down-text { color: var(--down); }

/* Coins and people */
.coin { display: inline-grid; flex: none; width: 28px; height: 28px; border-radius: 50%; }
.coin svg { width: 100%; height: 100%; display: block; overflow: visible; transform-origin: 50% 50%; }
.coin-sm { width: 22px; height: 22px; }
.coin-lg { width: 60px; height: 60px; filter: drop-shadow(0 8px 14px var(--shadow-coin)); }
.coin-xl { width: 132px; height: 132px; filter: drop-shadow(0 20px 26px var(--shadow-coin)); }
.coin-reed { fill: none; stroke: color-mix(in srgb, var(--metal) 38%, black); stroke-width: 2.4; stroke-dasharray: 0.55 1.05; opacity: 0.6; }
.coin-bead { fill: none; stroke: color-mix(in srgb, var(--metal) 30%, white); stroke-width: 1.4; stroke-dasharray: 0 2.45; stroke-linecap: round; opacity: 0.85; }
.coin-dot { fill: color-mix(in srgb, var(--metal) 30%, white); }
.coin text { font-family: var(--display); font-weight: 700; text-anchor: middle; dominant-baseline: central; letter-spacing: -0.6px; }
.coin-hi { fill: color-mix(in srgb, var(--metal) 25%, white); opacity: 0.75; }
.coin-lo { fill: color-mix(in srgb, var(--metal) 42%, black); }
.coin-sm .coin-reed, .coin-sm .coin-bead, .coin-sm .coin-dot, .coin-md .coin-bead { display: none; }
a:hover .coin-sm svg, a:hover .coin-md svg, .brand:hover .coin svg { animation: flip 0.9s cubic-bezier(0.3, 0.7, 0.3, 1); }
@keyframes flip { from { transform: rotateY(0); } to { transform: rotateY(360deg); } }
.avatar { display: inline-grid; place-items: center; flex: none; border-radius: 50%; font: 600 9.5px/1 var(--sans); letter-spacing: 0.02em;
  background: var(--soft); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-strong); }
.avatar-sm { width: 22px; height: 22px; }
.avatar-md { width: 26px; height: 26px; }
.meme-id { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-width: 0; }
.meme-sym { font-weight: 600; letter-spacing: -0.005em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meme-name { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.meme-id:hover .meme-sym { color: var(--gold-ink); }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.chip-hot { background: color-mix(in srgb, var(--hot) 15%, transparent); color: var(--hot-ink); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hot) 24%, transparent); }
.chip-accent, .chip-money { background: color-mix(in srgb, var(--gold) 13%, transparent); color: var(--gold-ink); }
.chip-up { background: color-mix(in srgb, var(--up) 13%, transparent); color: var(--up); }
.chip-down { background: color-mix(in srgb, var(--down) 13%, transparent); color: var(--down); }
.hot-text { color: var(--hot-ink); font-weight: 500; }

/* Numbers that just moved */
.flash { border-radius: 6px; }
.flash-up { animation: flash-up 1.1s ease-out; }
.flash-down { animation: flash-down 1.1s ease-out; }
@keyframes flash-up { from { background: color-mix(in srgb, var(--up) 32%, transparent); color: var(--up); } to { background: color-mix(in srgb, var(--up) 0%, transparent); } }
@keyframes flash-down { from { background: color-mix(in srgb, var(--down) 32%, transparent); color: var(--down); } to { background: color-mix(in srgb, var(--down) 0%, transparent); } }

/* Sparklines */
.spark { display: block; overflow: visible; }
.spark-up { color: var(--up); }
.spark-down { color: var(--down); }
.spark-line { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.spark-area { fill: currentColor; opacity: 0.1; }
.spark-dot { fill: currentColor; }
.spark-empty { display: inline-block; height: 1px; background: var(--line-strong); }
.spark-flat .spark-line { stroke: var(--muted); stroke-dasharray: 2 3; }

/* Ranked lists with a 3 px share bar along each row's bottom edge */
.ranked { display: grid; }
.ranked-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 88px 72px 112px 52px; align-items: center; gap: 10px;
  min-height: 48px; padding: 0 10px 5px; border-radius: 12px; text-decoration: none; transition: background 0.15s; }
.ranked.families .ranked-row { grid-template-columns: minmax(0, 1fr) 80px 64px 92px 104px 46px; }
.ranked.compact .ranked-row { grid-template-columns: minmax(0, 1fr) auto; }
.ranked-row.head { min-height: 30px; padding-bottom: 0; font-size: 12px; color: var(--muted); }
a.ranked-row:hover { background: color-mix(in srgb, var(--soft) 75%, transparent); }
.ranked-name { display: flex; align-items: center; gap: 9px; min-width: 0; overflow: hidden; padding-left: calc(var(--depth, 0) * 18px); }
.ranked-name .chip { flex: none; }
.col-trend { display: flex; justify-content: center; }
.branch { width: 10px; height: 14px; margin-top: -12px; border-left: 1.5px solid var(--line-strong); border-bottom: 1.5px solid var(--line-strong); border-bottom-left-radius: 4px; flex: none; }
.sharebar { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
.sharebar span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; opacity: 0.8; }
a.ranked-row:hover .sharebar span { opacity: 1; }
.tone-bg-accent, .tone-bg-money { background: linear-gradient(90deg, var(--gold-b), var(--gold-a)); }

/* To-do: noun, number, action */
.todo { list-style: none; margin: 0; padding: 0; display: grid; }
.todo li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "what chip act" "label chip act"; align-items: center; gap: 2px 10px;
  padding: 10px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; padding-top: 2px; }
.todo-what { grid-area: what; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--muted); }
.todo-what .meme-id { color: var(--ink); }
.todo-label { grid-area: label; font-size: 12.5px; }
.todo .chip { grid-area: chip; }
.todo .btn { grid-area: act; }

/* Activity table */
.activity { display: grid; }
.activity-row { display: grid; grid-template-columns: 96px 130px 120px minmax(0, 1fr) minmax(0, 1.3fr) 110px; align-items: center; gap: 10px;
  min-height: 46px; border-top: 1px solid var(--line); font-size: 13.5px; }
.activity-row.head { min-height: 28px; border-top: 0; font-size: 12px; color: var(--muted); }
.activity-row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who, .activity-meme { display: flex; align-items: center; gap: 7px; }
.activity-meme { color: var(--muted); }
.activity-meme .meme-id { color: var(--ink); }
.activity .link-btn { justify-self: start; margin-top: 8px; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 18px; border: 0; border-radius: 12px;
  background: linear-gradient(180deg, var(--gold-a), var(--gold-b)); color: var(--on-gold); font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.45), 0 8px 20px -10px color-mix(in srgb, var(--gold-b) 85%, transparent);
  transition: transform 0.12s, box-shadow 0.2s, filter 0.2s; }
.btn:hover:not(:disabled) { filter: brightness(1.06); transform: translateY(-1px);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.5), 0 12px 26px -10px color-mix(in srgb, var(--gold-b) 95%, transparent); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.38; cursor: not-allowed; box-shadow: none; }
.btn-sm { height: 30px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn-lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 14px; }
.btn-buy { background: linear-gradient(180deg, color-mix(in srgb, var(--up) 78%, white), var(--up)); color: var(--on-up);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35), 0 8px 20px -10px color-mix(in srgb, var(--up) 85%, transparent); }
.btn-sell { background: linear-gradient(180deg, color-mix(in srgb, var(--down) 78%, white), var(--down)); color: var(--on-down);
  box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35), 0 8px 20px -10px color-mix(in srgb, var(--down) 85%, transparent); }
.btn-buy:hover:not(:disabled) { box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4), 0 12px 26px -10px color-mix(in srgb, var(--up) 95%, transparent); }
.btn-sell:hover:not(:disabled) { box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4), 0 12px 26px -10px color-mix(in srgb, var(--down) 95%, transparent); }
.btn-quiet { background: var(--raised); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn-quiet:hover:not(:disabled) { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--gold) 45%, var(--line-strong)); filter: none; }
.btn.wide { width: 100%; }
.link-btn { border: 0; background: none; color: var(--gold-ink); cursor: pointer; padding: 4px 6px; font-size: 13px; font-weight: 600; }
.segmented { display: flex; padding: 4px; background: var(--well); border-radius: 12px; gap: 2px; min-width: 0; box-shadow: inset 0 0 0 1px var(--line); }
.segmented button { flex: 1 1 0; min-width: 0; height: 34px; border: 0; border-radius: 9px; background: none; color: var(--ink-2); font-weight: 600; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 10px; transition: background 0.15s, color 0.15s; }
.segmented button[aria-pressed="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 1px var(--line-strong); }
.segmented.side button[aria-pressed="true"]:first-child { background: color-mix(in srgb, var(--up) 16%, var(--raised)); color: var(--up); box-shadow: 0 0 0 1px color-mix(in srgb, var(--up) 40%, transparent); }
.segmented.side button[aria-pressed="true"]:last-child { background: color-mix(in srgb, var(--down) 16%, var(--raised)); color: var(--down); box-shadow: 0 0 0 1px color-mix(in srgb, var(--down) 40%, transparent); }
.segmented.sm button { height: 26px; font-size: 12.5px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row-between .segmented button { flex: 0 0 auto; }
form { display: grid; gap: 12px; }
.field { display: grid; gap: 7px; }
.field label, .field-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.field input, .field select, .propose select { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--well); }
.field input:focus, .field select:focus { border-color: color-mix(in srgb, var(--gold) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 14%, transparent); outline: none; }
.amount { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--well); padding-right: 6px; }
.amount:focus-within { border-color: color-mix(in srgb, var(--gold) 55%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 14%, transparent); }
.field .amount input, .field .amount input:focus { border: 0; border-radius: 0; background: none; box-shadow: none; }
.amount input { flex: 1 1 0; width: 0; min-width: 0; height: 48px; border: 0; background: none; padding: 0 14px; font: 600 20px var(--sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; outline: none; }
.amount.sm input { height: 36px; font-size: 15px; }
.unit { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 6px; }
.info { display: inline-grid; color: var(--muted); cursor: help; }
.inline-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.token { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px 0 6px; border-radius: 999px; background: var(--raised);
  box-shadow: inset 0 0 0 1px var(--line-strong); font: 600 13px var(--sans); white-space: nowrap; flex: none; max-width: 52%; overflow: hidden; text-overflow: ellipsis; }

/* Action card */
.action { border-color: color-mix(in srgb, var(--gold) 16%, var(--line-strong)); }
.swap { display: grid; gap: 6px; }
.swap-box { display: grid; gap: 8px; padding: 14px 14px 14px 16px; border-radius: 16px; background: var(--well); border: 1px solid var(--line); min-width: 0; }
.swap-box:focus-within { border-color: color-mix(in srgb, var(--gold) 50%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 12%, transparent); }
.swap-head { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--ink-2); }
.swap-head label { font-weight: 500; }
.swap-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.swap-row input { flex: 1 1 0; width: 0; min-width: 0; border: 0; background: none; outline: none; padding: 0; height: 38px;
  font: 600 28px var(--sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.swap-row strong { flex: 1 1 0; min-width: 0; font: 600 28px/38px var(--sans); letter-spacing: -0.03em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.swap-row strong.down-text { font-size: 18px; }
.swap-flip { justify-self: center; margin: -21px 0; position: relative; z-index: 1; width: 38px; height: 38px; border-radius: 12px; border: 4px solid var(--card);
  background: var(--raised); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; transition: transform 0.3s, color 0.15s; }
.swap-flip:hover { transform: rotate(180deg); color: var(--gold-ink); }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; color: var(--muted); }
.route-step { font: 500 12px var(--mono); padding: 2px 7px; border-radius: 7px; background: var(--soft); color: var(--ink-2); }
.spike { justify-self: start; }
.countdown { display: flex; align-items: center; gap: 18px; }
.countdown strong { font: 600 26px/1 var(--sans); letter-spacing: -0.03em; color: var(--hot-ink); }
.countdown .facts { flex: 1 1 0; min-width: 0; }
.facts { margin: 0; display: grid; gap: 8px; }
.facts div { display: flex; justify-content: space-between; gap: 10px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.stack { display: grid; gap: 10px; }
.empty { color: var(--muted); }
.empty-state { display: grid; justify-items: start; gap: 12px; padding: 12px 0; color: var(--muted); }

/* Segmented share bar, bullet graph, legends */
.segbar { display: flex; gap: 4px; height: 10px; }
.segbar span { border-radius: 999px; min-width: 6px; }
.seg-ink { background: var(--ink-2); }
.seg-accent { background: linear-gradient(90deg, var(--gold-b), var(--gold-a)); }
.seg-line { background: var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.key-ink { background: var(--ink-2); } .key-accent { background: var(--gold); } .key-line { background: var(--line-strong); }
.legend .key-line { background: var(--gold); height: 2px; border-radius: 1px; width: 14px; }
.key-dash { width: 14px; height: 0; border-top: 2px dashed var(--muted); border-radius: 0; }
.bullet { position: relative; height: 22px; border-radius: 7px; background: var(--well); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.bullet-range { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--ink) 6%, transparent); }
.bullet-bar { position: absolute; left: 0; top: 30%; height: 40%; border-radius: 4px; background: var(--ink-2); }
.bullet-bar.reached { background: linear-gradient(90deg, var(--gold-b), var(--gold-a)); box-shadow: 0 0 10px color-mix(in srgb, var(--gold) 60%, transparent); }
.bullet-target { position: absolute; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }

/* Family card: variants beside the union vote */
.family-grid { display: grid; gap: 20px; }
.family-grid.with-union { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.family-union { display: grid; gap: 12px; align-content: start; }
.family-grid.with-union .family-union { border-left: 1px solid var(--line); padding-left: 20px; }
.sub { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0; }

/* Launch */
.form { gap: 16px; }
.preview-card { background: radial-gradient(360px 260px at 50% 28%, color-mix(in srgb, var(--gold) 12%, transparent), transparent 72%), var(--card); }
.preview { display: grid; justify-items: center; gap: 16px; padding: 8px 0 4px; text-align: center; }
.preview-id { display: grid; gap: 2px; justify-items: center; min-width: 0; max-width: 100%; }
.preview-sym { font: 700 26px/1.1 var(--display); letter-spacing: -0.02em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview-card .route { justify-content: center; }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { position: relative; display: flex; justify-content: space-between; gap: 10px; padding: 9px 0 9px 22px; border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline li::before { content: ""; position: absolute; left: 3px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
  background: var(--card); box-shadow: inset 0 0 0 2px var(--gold); }
.timeline li:last-child::before { background: var(--gold); }
.timeline b { font-weight: 600; font-variant-numeric: tabular-nums; }
.meme-head { gap: 16px; }
.meme-head h1 { font-size: 30px; }
.meme-head h1 .meme-name { font: 400 16px var(--sans); margin-left: 8px; letter-spacing: 0; }
.meme-head > .chip, .meme-head > span.chip { margin-left: auto; }
.crumbs { display: flex; align-items: center; gap: 4px; font: 500 12.5px var(--mono); color: var(--muted); }
.crumbs a { text-decoration: none; color: var(--ink-2); }
.crumbs a:hover { color: var(--gold-ink); }
.crumbs a[aria-current="page"] { color: var(--muted); }
.crumb-sep { transform: rotate(-90deg); }

/* Unions */
.union { display: grid; gap: 10px; }
.union + .union, .propose { border-top: 1px solid var(--line); padding-top: 14px; }
.union-pair { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.union-arrow { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--soft); color: var(--gold-ink); }
.union-actions { display: flex; flex-wrap: wrap; gap: 8px; }
form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
form.inline .amount { flex: 1 1 180px; }
.propose select { width: auto; flex: 1 1 120px; height: 32px; font-size: 13px; border-radius: 9px; }

/* Chart */
.chart { position: relative; margin: 0; display: grid; gap: 10px; }
.chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; cursor: crosshair; border-radius: 6px; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font: 11px var(--sans); font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-linejoin: round; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--gold) 50%, transparent)); }
.chart .compare { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.8; }
.chart .hair { stroke: var(--line-strong); stroke-width: 1; }
.chart .dot { fill: var(--gold); stroke: var(--card); stroke-width: 2; }
.chart .dot-halo { fill: var(--gold); opacity: 0.22; transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
@keyframes halo { from { transform: scale(0.4); opacity: 0.45; } to { transform: scale(1.6); opacity: 0; } }
.chart-tip { position: absolute; top: 4px; transform: translateX(-50%); pointer-events: none; background: var(--tip); color: var(--on-tip); border-radius: 10px;
  padding: 7px 10px; display: grid; gap: 2px; white-space: nowrap; box-shadow: var(--shadow-pop); }
.chart-tip strong { font-size: 15px; font-variant-numeric: tabular-nums; }
.chart-tip span { font-size: 12px; color: color-mix(in srgb, var(--on-tip) 70%, transparent); }
.chart-empty { color: var(--muted); padding: 40px 0; text-align: center; }

/* Rules */
.prose { max-width: 760px; gap: 20px; }
.rules { margin: 0; padding-left: 26px; display: grid; gap: 20px; }
.rules li::marker { font: 600 14px var(--display); color: var(--gold-ink); }
.rules h2 { margin-bottom: 4px; font: 600 16px var(--display); letter-spacing: -0.01em; }
.rules p { color: var(--ink-2); max-width: 64ch; line-height: 1.6; }

/* Minting moment */
.mint { position: fixed; inset: 0; z-index: 40; pointer-events: none; display: grid; place-items: center; }
.mint-coin { animation: mint-drop 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
.mint-coin svg { animation: mint-spin 1.3s cubic-bezier(0.2, 0.7, 0.2, 1); }
.mint-coin .coin-xl { width: 168px; height: 168px; }
@keyframes mint-drop {
  0% { transform: translateY(-36vh) scale(0.55); opacity: 0; }
  24% { transform: translateY(0) scale(1.12); opacity: 1; }
  34% { transform: scale(1); }
  78% { transform: scale(1); opacity: 1; }
  100% { transform: translateY(12px) scale(0.92); opacity: 0; }
}
@keyframes mint-spin { from { transform: rotateY(-1080deg); } to { transform: rotateY(0); } }
.mint i { position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); border-radius: 50%; opacity: 0;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--metal) 40%, white), var(--metal) 55%, color-mix(in srgb, var(--metal) 55%, black));
  animation: burst 1.5s cubic-bezier(0.15, 0.7, 0.3, 1) calc(380ms + var(--delay)) forwards; }
@keyframes burst {
  0% { opacity: 1; transform: translate(0, 0) scale(0.4) rotateY(0); }
  55% { opacity: 1; transform: translate(var(--x), var(--y)) scale(1) rotateY(var(--spin)); }
  100% { opacity: 0; transform: translate(var(--x), calc(var(--y) + 150px)) scale(0.9) rotateY(var(--spin)); }
}

/* Tooltip, toasts, states */
#tip { position: fixed; z-index: 50; max-width: 300px; padding: 8px 11px; border-radius: 10px; background: var(--tip); color: var(--on-tip); font-size: 12px;
  pointer-events: none; opacity: 0; transition: opacity 0.12s; display: grid; gap: 3px; box-shadow: var(--shadow-pop); }
#tip.show { opacity: 1; }
#tip strong { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
#tip span { color: color-mix(in srgb, var(--on-tip) 72%, transparent); white-space: pre-line; line-height: 1.4; }
.toasts { position: fixed; z-index: 30; display: grid; gap: 8px; justify-items: end; pointer-events: none;
  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); }
.toast { display: inline-flex; align-items: center; gap: 8px; max-width: 420px; background: var(--tip); color: var(--on-tip); border-radius: 12px; padding: 10px 14px;
  font-weight: 500; box-shadow: var(--shadow-pop), inset 0 0 0 1px color-mix(in srgb, var(--gold) 25%, transparent); animation: toast-in 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
.toast .icon { color: var(--gold); }
.toast.error { background: var(--down); color: var(--on-down); box-shadow: var(--shadow-pop); }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } }
.skeleton { display: grid; gap: 10px; width: 100%; }
.skeleton span { height: 14px; border-radius: 6px; background: var(--soft); animation: pulse 1.4s ease-in-out infinite; }
.skeleton span:first-child { width: 40%; }
.skeleton-coin { display: block; width: 132px; height: 132px; border-radius: 50%; background: var(--soft); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
.boot-error { max-width: 480px; margin: 20vh auto 0; justify-items: start; }
.page-note { padding-block: 10px; color: var(--hot-ink); font-weight: 500; }
.foot { display: flex; flex-wrap: wrap; gap: 6px 16px; padding-block: 4px 32px; font-size: 12px; color: var(--muted); }
.foot a { color: var(--ink-2); }

@media (max-width: 1180px) {
  .tabs { display: none; }
  .menu-button { display: inline-flex; }
}
@media (max-width: 1024px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .kpis-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .span-8, .span-4, .span-7, .span-5 { grid-column: span 12; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .activity-row { grid-template-columns: 84px 110px minmax(0, 1fr) minmax(0, 1.4fr) 90px; }
  .activity-row > :nth-child(3) { display: none; }
}
@media (max-width: 640px) {
  .top-inner { gap: 10px; min-height: 56px; }
  .phone-menu { top: calc(env(safe-area-inset-top, 0px) + 56px); }
  .brand span:last-child { display: none; }
  .pills { gap: 4px; }
  .pill { height: 32px; padding: 0 9px; }
  .theme-toggle { width: 32px; padding: 0; }
  .clock .tnum, .account .muted, .account-name, .menu-label { display: none; }
  .menu-button { width: 32px; padding: 0; justify-content: center; }
  h1 { font-size: 22px; }
  .kpis, .kpis-grid, .hero.no-spot .kpis-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi { padding: 12px 14px; }
  .kpi-value { font-size: 22px; }
  .icon-square { display: none; }
  .spotlight { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 22px 18px; justify-items: center; text-align: center;
    background: radial-gradient(300px 220px at 50% 22%, color-mix(in srgb, var(--gold) 14%, transparent), transparent 72%), var(--card); }
  .spot-stage { min-width: 0; }
  .spotlight .ring { width: 150px; height: 150px; }
  .spotlight .coin-xl { width: 104px; height: 104px; }
  .spot-body { justify-items: center; width: 100%; }
  .spot-stats { justify-content: center; gap: 10px 22px; }
  .spot-stats div { justify-items: center; }
  .spot-actions { justify-content: center; width: 100%; }
  .spot-actions .btn { width: 100%; }
  .spot-spark { display: none; }
  .family-grid.with-union { grid-template-columns: minmax(0, 1fr); }

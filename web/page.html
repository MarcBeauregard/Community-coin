<title>Community Coin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Launchpad de memecoins où les copies nourrissent l'original : enchère d'ouverture, vesting, part de pic et Unions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a calm market dashboard after the dashboard-design skill. Toolbar of pills (network, chain clock,
   account); per page one row of KPI cards, then the main view with its to-do list beside it, then detail.
   Grey page, white cards, one blue for memes and selection, one green for ETH, amber only for what needs you. */
:root {
  --page: #f8f8f6;
  --card: #ffffff;
  --soft: #f1f1ef;
  --ink: #17171a;
  --ink-2: #48484d;
  --muted: #66666d;
  --line: rgb(0 0 0 / 0.075);
  --line-strong: rgb(0 0 0 / 0.14);
  --accent: #3e63dd;
  --on-accent: #ffffff;
  --money: #0f7f57;
  --up: #0f7f57;
  --down: #d23f45;
  --warn: #b57a00;
  --warn-ink: #7a5200;
  --tip: #1f2530;
  --live: #12a150;
  --cat-0: #3e63dd;
  --cat-1: #8e4ec6;
  --cat-2: #12a594;
  --cat-3: #e5484d;
  --cat-4: #f76b15;
  --cat-5: #6b7280;
  --shadow-card: 0 1px 2px rgb(0 0 0 / 0.04), 0 1px 1px rgb(0 0 0 / 0.02);
  --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / 0.18), 0 0 0 1px rgb(0 0 0 / 0.06);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #0b0b0d; --card: #141417; --soft: #1c1c20; --ink: #f3f3f5; --ink-2: #c4c4ca; --muted: #8c8c95;
    --line: rgb(255 255 255 / 0.08); --line-strong: rgb(255 255 255 / 0.16);
    --accent: #7b96ff; --on-accent: #0b1030; --money: #34c48b; --up: #34c48b; --down: #ff6b70;
    --warn: #f6b100; --warn-ink: #ffd76a; --tip: #2a3548; --live: #34c48b;
    --cat-0: #7b96ff; --cat-1: #bf8af0; --cat-2: #3fd3c0; --cat-3: #ff7b80; --cat-4: #ff9b57; --cat-5: #9aa0ab;
    --shadow-card: 0 0 0 1px rgb(255 255 255 / 0.02);
    --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / 0.6), 0 0 0 1px rgb(255 255 255 / 0.08);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #0b0b0d; --card: #141417; --soft: #1c1c20; --ink: #f3f3f5; --ink-2: #c4c4ca; --muted: #8c8c95;
  --line: rgb(255 255 255 / 0.08); --line-strong: rgb(255 255 255 / 0.16);
  --accent: #7b96ff; --on-accent: #0b1030; --money: #34c48b; --up: #34c48b; --down: #ff6b70;
  --warn: #f6b100; --warn-ink: #ffd76a; --tip: #2a3548; --live: #34c48b;
  --cat-0: #7b96ff; --cat-1: #bf8af0; --cat-2: #3fd3c0; --cat-3: #ff7b80; --cat-4: #ff9b57; --cat-5: #9aa0ab;
  --shadow-card: 0 0 0 1px rgb(255 255 255 / 0.02);
  --shadow-pop: 0 12px 32px -8px rgb(0 0 0 / 0.6), 0 0 0 1px rgb(255 255 255 / 0.08);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--page); color: var(--ink); font: 14px/1.45 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
a { color: inherit; }
h1, h2, p { margin: 0; }
h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum, .num { font-variant-numeric: tabular-nums; }
.num { text-align: right; }
.muted { color: var(--muted); }
.fine { font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.icon { flex: none; display: block; }

/* Frame */
.top-inner, main, .foot, .page-note {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 112.5rem) { .top-inner, main, .foot, .page-note { max-width: 1640px; } }
main { padding-block: 20px 32px; }
.page { display: grid; gap: 16px; }
.narrow-page { max-width: 1080px; }
.page-head { display: flex; align-items: center; gap: 14px; min-height: 36px; }

/* Toolbar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; align-items: center; gap: 16px; min-height: 60px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; text-decoration: none; letter-spacing: -0.01em; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--card);
  font: 600 11px/1 var(--mono); letter-spacing: 0.02em; }
.tabs { display: flex; gap: 2px; padding: 3px; background: var(--soft); border-radius: 11px; }
.tabs a { display: flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow-card), 0 0 0 1px var(--line); }
.pills { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border: 1px solid var(--line); background: var(--card);
  border-radius: 999px; font-weight: 500; font-size: 13px; cursor: pointer; white-space: nowrap; }
.pill:hover { background: var(--soft); }
.pill-static { cursor: default; }
.pill-static:hover { background: var(--card); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.dot-live { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 18%, transparent); }
.dot-demo { background: var(--warn); }
.account-name { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; }
.menu-button { display: none; }
.popover { position: relative; }
.menu { position: absolute; top: calc(100% + 6px); min-width: 210px; padding: 6px; background: var(--card); border-radius: 12px; box-shadow: var(--shadow-pop); z-index: 20; display: grid; }
.menu-end { right: 0; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; text-align: left; cursor: pointer; }
.menu button:hover:not(:disabled) { background: var(--soft); }
.menu button:disabled { color: var(--muted); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
.menu-title { padding: 6px 10px 4px; font-size: 12px; color: var(--muted); }
.menu-check { margin-left: auto; color: var(--accent); }
.phone-menu { position: fixed; inset: 0; top: calc(env(safe-area-inset-top, 0px) + 60px); background: rgb(0 0 0 / 0.25); z-index: 5; }
.menu-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  background: var(--card); border-bottom: 1px solid var(--line); box-shadow: var(--shadow-pop); }
.menu-grid a { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 12px; text-decoration: none; color: var(--ink-2); font-weight: 500; font-size: 13px; }
.menu-grid a[aria-current="page"] { background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); }

/* Cards */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-card); min-width: 0; }
.panel { padding: 20px; display: grid; gap: 14px; align-content: start; }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.panel-value { margin-top: 2px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel-actions { display: flex; gap: 6px; }
.grid-12 { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
.span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-7 { grid-column: span 7; } .span-5 { grid-column: span 5; }
.stack-col { display: grid; gap: 16px; }
.grid-auto { display: grid; gap: 16px; align-items: start; }
.grid-auto.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-auto.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }

/* KPI cards: label and icon square, big number, delta with a one-word baseline */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-12 > *, .grid-auto > *, .kpis > * { min-width: 0; }
.kpi { padding: 16px 18px; display: grid; gap: 6px; }
.kpi-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-2); font-size: 13.5px; }
.icon-square { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--soft); color: var(--ink-2); }
.kpi-value { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-value small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 5px; }
.kpi.tone-warn { background: color-mix(in srgb, var(--warn) 9%, var(--card)); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.kpi.tone-warn .kpi-value { color: var(--warn-ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.kpi-foot { min-height: 18px; }
.delta { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.delta b { font-weight: 500; }
.delta .up { color: var(--up); }
.delta .down { color: var(--down); }

/* Avatars and meme names */
.avatar { display: inline-grid; place-items: center; flex: none; border-radius: 8px; font: 600 10.5px/1 var(--sans); letter-spacing: 0.01em;
  background: color-mix(in srgb, var(--hue) 16%, var(--card)); color: color-mix(in srgb, var(--hue) 70%, var(--ink)); }
.avatar-sm { width: 22px; height: 22px; border-radius: 7px; font-size: 10px; }
.avatar-md { width: 26px; height: 26px; }
.avatar-lg { width: 44px; height: 44px; border-radius: 12px; font-size: 15px; }
.meme-id { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; min-width: 0; }
.meme-sym { font-weight: 600; letter-spacing: -0.005em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meme-name { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.meme-id:hover .meme-sym { text-decoration: underline; text-underline-offset: 3px; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: var(--soft); color: var(--ink-2); white-space: nowrap; }
.chip-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn-ink); }
.chip-accent { background: color-mix(in srgb, var(--accent) 12%, transparent); color: color-mix(in srgb, var(--accent) 80%, var(--ink)); }
.chip-money { background: color-mix(in srgb, var(--money) 13%, transparent); color: color-mix(in srgb, var(--money) 82%, var(--ink)); }
.warn-text { color: var(--warn-ink); font-weight: 500; }

/* Ranked lists with a 3 px share bar along each row's bottom edge */
.ranked { display: grid; }
.ranked-row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 88px 72px 112px 52px; align-items: center; gap: 10px;
  min-height: 46px; padding: 0 10px 5px; border-radius: 10px; text-decoration: none; }
.ranked.compact .ranked-row { grid-template-columns: minmax(0, 1fr) auto; }
.ranked-row.head { min-height: 30px; padding-bottom: 0; font-size: 12px; color: var(--muted); }
a.ranked-row:hover { background: color-mix(in srgb, var(--soft) 70%, transparent); }
.ranked-name { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; padding-left: calc(var(--depth, 0) * 18px); }
.ranked-name .chip { flex: none; }
.branch { width: 10px; height: 14px; margin-top: -12px; border-left: 1.5px solid var(--line-strong); border-bottom: 1.5px solid var(--line-strong); border-bottom-left-radius: 4px; flex: none; }
.sharebar { position: absolute; left: 10px; right: 10px; bottom: 4px; height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
.sharebar span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; opacity: 0.75; }
a.ranked-row:hover .sharebar span { opacity: 1; }
.tone-bg-accent { background: var(--accent); }
.tone-bg-money { background: var(--money); }

/* To-do: noun, number, action */
.todo { list-style: none; margin: 0; padding: 0; display: grid; }
.todo li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-areas: "what chip act" "label chip act"; align-items: center; gap: 2px 10px;
  padding: 9px 0; border-top: 1px solid var(--line); }
.todo li:first-child { border-top: 0; padding-top: 2px; }
.todo-what { grid-area: what; display: flex; align-items: center; gap: 6px; min-width: 0; }
.todo-label { grid-area: label; font-size: 12.5px; }
.todo .chip { grid-area: chip; }
.todo .btn { grid-area: act; }

/* Activity table */
.activity { display: grid; }
.activity-row { display: grid; grid-template-columns: 96px 130px 120px minmax(0, 1fr) minmax(0, 1.3fr) 110px; align-items: center; gap: 10px;
  min-height: 44px; border-top: 1px solid var(--line); font-size: 13.5px; }
.activity-row.head { min-height: 28px; border-top: 0; font-size: 12px; color: var(--muted); }
.activity-row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who, .activity-meme { display: flex; align-items: center; gap: 7px; }
.activity .link-btn { justify-self: start; margin-top: 8px; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 38px; padding: 0 16px; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--on-accent); font-weight: 500; text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { filter: brightness(1.07); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-sm { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 8px; }
.btn-quiet { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn-quiet:hover:not(:disabled) { background: var(--soft); filter: none; }
.btn.wide { width: 100%; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 6px; font-size: 13px; font-weight: 500; }
.segmented { display: flex; padding: 3px; background: var(--soft); border-radius: 10px; gap: 2px; min-width: 0; }
.segmented button { flex: 1 1 0; min-width: 0; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--ink-2); font-weight: 500; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 10px; }
.segmented button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: var(--shadow-card), 0 0 0 1px var(--line); }
.segmented.sm button { height: 26px; font-size: 12.5px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.row-between .segmented button { flex: 0 0 auto; }
form { display: grid; gap: 12px; }
.field { display: grid; gap: 7px; }
.field label, .field-label { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.field input, .field select, .propose select { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); }
.amount { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--card); padding-right: 6px; }
.amount:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
.amount input { flex: 1 1 0; width: 0; min-width: 0; height: 44px; border: 0; background: none; padding: 0 12px; font: 500 18px var(--mono); outline: none; }
.amount.sm input { height: 34px; font-size: 14px; }
.unit { font-size: 12px; font-weight: 600; color: var(--muted); padding: 0 6px; }
.info { display: inline-grid; color: var(--muted); cursor: help; }
.inline-actions { display: flex; gap: 6px; flex-wrap: wrap; }

/* Action card */
.action { border-color: var(--line-strong); }
.receive { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 0; border-block: 1px solid var(--line); }
.receive strong { font: 500 20px var(--mono); letter-spacing: -0.02em; text-align: right; }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; color: var(--muted); }
.route-step { font: 500 12px var(--mono); padding: 2px 7px; border-radius: 6px; background: var(--soft); color: var(--ink-2); }
.spike { justify-self: start; }
.countdown { display: flex; align-items: center; gap: 10px; color: var(--warn-ink); }
.countdown strong { font: 600 34px/1 var(--mono); letter-spacing: -0.03em; }
.facts { margin: 0; display: grid; gap: 8px; }
.facts div { display: flex; justify-content: space-between; gap: 10px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
.stack { display: grid; gap: 10px; }
.empty { color: var(--muted); }
.empty-state { display: grid; justify-items: start; gap: 12px; padding: 12px 0; color: var(--muted); }

/* Segmented share bar, bullet graph, legends */
.segbar { display: flex; gap: 4px; height: 10px; }
.segbar span { border-radius: 999px; min-width: 6px; }
.seg-ink { background: var(--ink-2); }
.seg-accent { background: var(--accent); }
.seg-line { background: var(--line-strong); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.key-ink { background: var(--ink-2); } .key-accent { background: var(--accent); } .key-line { background: var(--line-strong); }
.legend .key-line { background: var(--accent); height: 2px; border-radius: 1px; width: 14px; }
.key-dash { width: 14px; height: 0; border-top: 2px dashed var(--muted); border-radius: 0; }
.bullet { position: relative; height: 22px; border-radius: 6px; background: color-mix(in srgb, var(--ink) 6%, transparent); overflow: hidden; }
.bullet-range { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--ink) 9%, transparent); }
.bullet-bar { position: absolute; left: 0; top: 33%; height: 34%; border-radius: 3px; background: var(--ink-2); }
.bullet-bar.reached { background: var(--money); }
.bullet-target { position: absolute; top: 3px; bottom: 3px; width: 2px; margin-left: -1px; background: var(--ink); border-radius: 1px; }

/* Family card: variants beside the union vote */
.family-grid { display: grid; gap: 20px; }
.family-grid.with-union { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.family-union { display: grid; gap: 12px; align-content: start; }
.family-grid.with-union .family-union { border-left: 1px solid var(--line); padding-left: 20px; }
.sub { font-size: 13px; font-weight: 500; color: var(--muted); margin: 0; }

/* Launch timeline */
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.timeline li { position: relative; display: flex; justify-content: space-between; gap: 10px; padding: 9px 0 9px 22px; border-top: 1px solid var(--line); }
.timeline li:first-child { border-top: 0; }
.timeline li::before { content: ""; position: absolute; left: 3px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; border-radius: 50%;
  background: var(--card); box-shadow: inset 0 0 0 2px var(--accent); }
.timeline li:last-child::before { background: var(--accent); }
.timeline b { font-weight: 500; font-variant-numeric: tabular-nums; }

/* Unions */
.union { display: grid; gap: 10px; }
.union + .union, .propose { border-top: 1px solid var(--line); padding-top: 14px; }
.union-pair { display: flex; align-items: center; gap: 6px; color: var(--muted); }
.union-actions { display: flex; flex-wrap: wrap; gap: 8px; }
form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
form.inline .amount { flex: 1 1 180px; }

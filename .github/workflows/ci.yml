name: CI

on:
  push:
  pull_request:

jobs:
  # The Solana program, then the JavaScript replica and the wire format checked against what its tests wrote.
  solana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: cargo-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:solana
        env:
          RUST_LOG: error
      - run: npm run test:protocol
      - run: npm run test:wire
      # The lobbies' JavaScript side against the program's lobby walk (written by test:solana).
      - run: node web/lobbies/chain-check.mjs

  # The app, its simulator, and the Base contracts kept as the reference.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: node web/simulate.mjs
      - run: npm test
      - run: npm run build:lobbies
      # The lobbies' server, crank, clans, voice and load, without a browser (the Chromium parts run locally).
      - run: npm run test:realtime && npm run test:crank && npm run test:clans && npm run test:voice
        env:
          NO_BROWSER: "1"
      - run: npm run test:load -- 1000

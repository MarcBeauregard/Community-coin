name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npm run build:lobbies
      # The lobbies' server, crank, clans, voice and load, without a browser (the Chromium parts run locally).
      - run: npm run test:realtime && npm run test:crank && npm run test:clans && npm run test:voice
        env:
          NO_BROWSER: "1"
      - run: npm run test:load -- 1000

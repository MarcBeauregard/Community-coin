name: CI

on:
  push:
  pull_request:

jobs:
  # Everything `npm test` checks: the Solana program, its JavaScript replica and wire format against what the
  # program's tests wrote, the simulator, the launchpad in Chromium, then every lobby check (server, crank, clans,
  # voice, the app in Chromium at four widths, accessibility, load).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: cargo-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock') }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RUST_LOG: error
          LOAD_PEOPLE: "1000"
